; The scenarios of the AI benchmark (tools/ai_bench.py): a section per scenario, its "options" the ee-aoc --sim options
; of its games. Every game has two computer players (players 2 and 3) and the sim's idle human (player 1), and runs to
; a win or 8 game hours. The sim's lobby defaults hold where a scenario says nothing: a Small Continental map,
; "Standard - High" resources, the Prehistoric Age to the Space Age, 5 starting citizens, Hard.
; Lobby controls: 177 map size, 179 map type, 181 resources, 183 start age, 185 end age, 126 + slot the starting
; citizens of a slot (slot 0 is the human). The values are line names of the lobby's own lists.

[standard]
options = --ai 2

[poor]
options = --ai 2 --lobby "181=Standard - Low" --lobby 126=3 --lobby 127=3 --lobby 128=3

[rich]
options = --ai 2 --lobby 181=Deathmatch --lobby 126=10 --lobby 127=10 --lobby 128=10

[tournament]
options = --ai 2 --lobby "181=Tournament - Low"

[middle]
options = --ai 2 --lobby "183=Middle Ages"

[industrial]
options = --ai 2 --lobby "183=Industrial Age"

[tiny]
options = --ai 2 --map-size Tiny

[plains]
options = --ai 2 --map-size Medium --map-type Plains

[highlands]
options = --ai 2 --map-type Highlands

[raids]
options = --ai 2 --army thrower:20 --army bow:20 --army-at 400 --army-raid --army-every 600
